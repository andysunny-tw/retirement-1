    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'retro-paper': '#fdfbf7',
                        'retro-green': '#009e46',
                        'retro-red': '#e3002b',
                        'retro-ink': '#2b2b2b',
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                    },
                    boxShadow: {
                        'paper': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05), 5px 5px 0px 0px rgba(0,0,0,0.1)',
                    }
                }
            }
        }

    <style>
        body {
            background-color: #333;
            background-image: radial-gradient(#444 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .calendar-hole {
            background: #333;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.5);
        }
        .tear-off-effect {
            mask-image: linear-gradient(180deg, black 95%, transparent 100%);
            border-bottom: 2px dashed #d1d5db;
        }
        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 0.1em;
        }
        
        /* Animation Classes */
        @keyframes tearOff {
            0% { transform: rotate(0deg); transform-origin: top left; opacity: 1; }
            20% { transform: rotate(-5deg); transform-origin: top left; opacity: 1; }
            100% { transform: translateY(150%) rotate(20deg); transform-origin: top left; opacity: 0; }
        }
        @keyframes pasteBack {
            0% { transform: translateY(-120%) rotate(-10deg); opacity: 0; }
            100% { transform: translateY(0) rotate(0deg); opacity: 1; }
        }

        .animating-clone {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fdfbf7;
            z-index: 50;
            pointer-events: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            mask-image: linear-gradient(180deg, black 95%, transparent 100%);
            border-bottom: 2px dashed #d1d5db;
        }

        .animate-tear-off {
            animation: tearOff 0.8s ease-in forwards;
        }
        .animate-paste-back {
            animation: pasteBack 0.6s ease-out forwards;
        }

        .nav-btn {
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.2s;
        }
        .calendar-container:hover .nav-btn {
            opacity: 1;
        }
        @media (hover: none) {
            .nav-btn {
                opacity: 0.6;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #888; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }

        /* PRINT STYLES */
        @media print {
            body {
                background: white !important;
                display: block !important;
                height: auto !important;
                padding: 0 !important;
                overflow: visible !important;
            }
            .no-print {
                display: none !important;
            }
            /* Hide the main interactive app */
            .calendar-container {
                display: none !important;
            }
            /* Show the print area */
            #print-area {
                display: block !important;
            }
            
            /* Grid Layout for "Cut Mode" */
            .print-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr); /* 2 cols */
                gap: 10px;
                padding: 10px;
            }
            .print-card {
                border: 2px dashed #ccc;
                padding: 10px;
                page-break-inside: avoid;
                background: #fff;
                height: 300px; /* Fixed height for consistency */
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: space-between;
            }

            /* List Layout for "Paper Saving Mode" */
            .print-list {
                width: 100%;
                border-collapse: collapse;
            }
            .print-list th, .print-list td {
                border: 1px solid #ccc;
                padding: 8px;
                text-align: left;
                font-size: 12px;
            }
            .print-list th {
                background-color: #f0f0f0;
            }
            
            /* Ensure colors print */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center font-serif p-2 overflow-x-hidden">

            "不要跟成績過不去，也不要跟自己過不去。", "每個老師心裡，都住著一個想去流浪的靈魂。", "退休後的廣場舞，C位已經預訂好了。",

            "校長的話很長，但我離退休的日子變短了。", "研習時的點頭，不是贊同，是打瞌睡。", "教學觀摩，是一場華麗的表演。",
            "每個學期末，都是一次重生。", "開學日，是渡劫的開始。", "結業式，是渡劫成功。", "想退休的心，藏得住眼神，藏不住嘴角。",
            "退休不是夢，是正在進行的計畫。", "存錢的速度，要趕上想退休的速度。", "不要羨慕別人的工作，因為大家都在想退休。",
            "今天的氣，留給明天的力氣去玩。", "學生不懂事是正常的，老師不退休是不正常的（誤）。", "黑板上的字，寫著寫著就變成「退休」兩個字。",
            "講台站久了，腿會酸，心會飛。", "每一屆學生都是過客，只有退休金是真愛。", "不要把工作帶回家，把退休心情帶回家。",
            "週末是短暫的充電，退休是永久的滿電。", "連假結束不憂鬱，因為離退休又近了三天。", "補課是為了還債，上班是為了退休。",
            "不想上班的念頭，每天會出現一萬次。", "撐住，再撐幾年，你就是傳說中的退休人員。", "辦公桌上的日曆，是我的精神支柱。",
            "看著倒數日曆，突然覺得這個班也沒那麼難帶。", "退休生活規劃好了嗎？第一件事：睡到自然醒。", "以後不用改作業，只改旅遊行程。",
            "以後不用管秩序，只管要吃什麼。", "以後不用打鐘，只想去哪裡兜風。", "把講台留給年輕人，把世界留給自己。",
            "退休那天，我要笑著走出校門，不帶走一片雲彩。", "現在的辛苦，都會變成未來的談資。", "再忍忍，你的自由號列車即將進站。",
            "生活不止眼前的苟且，還有即將到來的退休。", "每天撕一張日曆，撕下的是束縛，露出的是自由。", "堅持住，我們這是在為國家培育棟樑... 順便等退休。"
        ];

        // --- Initialization ---
        function init() {
            renderCalendar(currentViewDate);
            updateTitle();
            updateMotto(currentViewDate);
            
            if (!retirementDate) {
                toggleSettings();
            } else {
                updateCountdown(currentViewDate);
            }

            if(retirementDate) {
                els.inputDate.value = retirementDate;
            } else {
                els.inputDate.valueAsDate = new Date(new Date().setFullYear(new Date().getFullYear() + 1));
            }
            els.inputName.value = teacherName;

            document.addEventListener('keydown', (e) => {
                if (els.modal.classList.contains('hidden') && els.printModal.classList.contains('hidden') && !isAnimating) {
                    if (e.key === 'ArrowRight') changeDay(1);
                    if (e.key === 'ArrowLeft') changeDay(-1);
                }
            });
        }

        // --- Navigation Logic ---
        function changeDay(offset) {
            if (isAnimating) return;
            isAnimating = true;

            const oldDate = new Date(currentViewDate);
            currentViewDate.setDate(currentViewDate.getDate() + offset);

            if (offset > 0) {
                // Clone Old Date
                const clone = els.content.cloneNode(true);
                clone.classList.add('animating-clone', 'animate-tear-off');
                clone.id = '';
                els.wrapper.appendChild(clone);

                // Update real content
                renderAll(currentViewDate);

                clone.addEventListener('animationend', () => {
                    clone.remove();
                    isAnimating = false;
                });
            } else {
                // Update content first
                renderAll(currentViewDate);

                // Clone New Date (flying in)
                const clone = els.content.cloneNode(true);
                clone.classList.add('animating-clone', 'animate-paste-back');
                clone.id = '';
                els.wrapper.appendChild(clone);
                
                clone.addEventListener('animationend', () => {
                    clone.remove();
                    isAnimating = false;
                });
            }
            
            checkResetButton();
        }

        function resetToToday() {
            if(isAnimating) return;
            currentViewDate = new Date();
            renderAll(currentViewDate);
            checkResetButton();
        }

        function checkResetButton() {
            const today = new Date();
            const isToday = currentViewDate.toDateString() === today.toDateString();
            if (isToday) {
                els.resetBtn.classList.add('hidden');
            } else {
                els.resetBtn.classList.remove('hidden');
            }
        }

        function renderAll(date) {
            renderCalendar(date);
            updateCountdown(date);
            updateMotto(date);
        }

        // --- Core Functions ---
        function updateTitle() {
            els.title.textContent = (teacherName && teacherName.trim() !== "") ? 
                `${teacherName} 老師的退休倒數日曆` : "退休倒數日曆";
        }

        function updateMotto(date) {
            const seed = date.getFullYear() * 10000 + (date.getMonth() + 1) * 100 + date.getDate();
            const index = seed % quotes.length;
            els.motto.textContent = quotes[index];
        }

        function getMottoForDate(date) {
            const seed = date.getFullYear() * 10000 + (date.getMonth() + 1) * 100 + date.getDate();
            const index = seed % quotes.length;
            return quotes[index];
        }

        function renderCalendar(date) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const dayOfWeek = date.getDay();
            
            els.rocYear.textContent = year - 1911;
            els.monthNum.textContent = month;
            els.dayNum.textContent = day;

            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            els.weekDay.textContent = weekdays[dayOfWeek];

            // Consistent Class Names for Real DOM and Clone
            const baseDayNumClass = "text-[6rem] leading-none font-black drop-shadow-sm font-sans scale-y-110 -mb-1";
            const baseWeekDayClass = "text-xl font-bold mt-0 border-2 rounded-full w-10 h-10 flex items-center justify-center";

            if (dayOfWeek === 0) { // Sun
                els.dayNum.className = `${baseDayNumClass} text-retro-red`;
                els.weekDay.className = `${baseWeekDayClass} text-retro-red border-retro-red`;
            } else if (dayOfWeek === 6) { // Sat
                els.dayNum.className = `${baseDayNumClass} text-retro-green`;
                els.weekDay.className = `${baseWeekDayClass} text-retro-green border-retro-green`;
            } else { // Weekday
                els.dayNum.className = `${baseDayNumClass} text-retro-ink`;
                els.weekDay.className = `${baseWeekDayClass} text-retro-ink border-retro-ink`;
            }

            const rocYear = year - 1911;
            const rocDateString = `民國${rocYear}年${month}月${day}日`;
            const today = new Date();
            const isRealToday = date.toDateString() === today.toDateString();
            els.lunarDate.textContent = rocDateString + (isRealToday ? " (今日)" : "");
        }

        function updateCountdown(currentDateContext) {
            if (!retirementDate) return;
            const now = new Date(currentDateContext);
            now.setHours(0,0,0,0);
            const target = new Date(retirementDate);
            target.setHours(0,0,0,0);
            const diffTime = target - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays <= 0) {
                els.sidebarCountdown.textContent = "已退休";
                els.detailCountdown.innerHTML = "<span class='text-retro-red'>恭喜您！這天已經退休！</span>";
                els.semesterDetail.textContent = "享受自由自在的人生吧！";
                return;
            }

            els.sidebarCountdown.textContent = `剩餘${diffDays}天`;

            let y = target.getFullYear() - now.getFullYear();
            let m = target.getMonth() - now.getMonth();
            let d = target.getDate() - now.getDate();

            if (d < 0) {
                m--;
                const prevMonth = new Date(target.getFullYear(), target.getMonth(), 0);
                d += prevMonth.getDate();
            }
            if (m < 0) {
                y--;
                m += 12;
            }

            let detailText = "還有 ";
            if (y > 0) detailText += `<span class="text-retro-red text-lg">${y}</span> 年 `;
            if (m > 0) detailText += `<span class="text-retro-red text-lg">${m}</span> 個月 `;
            detailText += `<span class="text-retro-red text-lg">${d}</span> 天`;
            els.detailCountdown.innerHTML = detailText;
            
            const semesterInfo = calculateSemesters(now, target);
            els.semesterDetail.innerHTML = `再奮鬥 <b>${semesterInfo}</b> 就自由了！`;
        }

        function calculateSemesters(start, end) {
            function getSemesterCode(date) {
                const m = date.getMonth();
                const y = date.getFullYear();
                if (m >= 1 && m <= 6) return `${y}-2`; 
                if (m === 0) return `${y-1}-1`; 
                return `${y}-1`;
            }
            const startSem = getSemesterCode(start);
            const endSem = getSemesterCode(end);
            if (startSem === endSem) return "1 個學期 (當前)";

            let sCode = startSem;
            let semCount = 0;
            let [currY, currS] = sCode.split('-').map(Number);
            const endY = end.getFullYear();

            while (true) {
                semCount++;
                const currentCode = `${currY}-${currS}`;
                if (currentCode === endSem) break;
                if (currS === 1) { currS = 2; } 
                else { currY += 1; currS = 1; }
                if (currY > endY + 2) break;
            }
            return `${semCount} 個學期`;
        }

        // --- Interaction ---
        function toggleSettings() {
            els.modal.classList.toggle('hidden');
        }
        function togglePrintModal() {
            els.printModal.classList.toggle('hidden');
        }

        function saveSettings() {
            const dateVal = els.inputDate.value;
            const nameVal = els.inputName.value;
            if (dateVal) {
                retirementDate = dateVal;
                teacherName = nameVal;
                localStorage.setItem('retirementDate', retirementDate);
                localStorage.setItem('teacherName', teacherName);
                currentViewDate = new Date();
                renderAll(currentViewDate);
                updateTitle();
                checkResetButton();
                toggleSettings();
            }
        }

        // --- Print Logic ---
        function executePrint() {
            const mode = els.printMode.value;
            const range = els.printRange.value;
            
            els.printArea.innerHTML = '';
            
            let startDate = new Date(currentViewDate); // Default for single
            if (mode !== 'current') {
                startDate = new Date(); // Grid/List starts from Today usually, or Current View? Let's do Today for usefulness.
                // Or respect user's view? Let's use current view as start so they can print future months.
                startDate = new Date(currentViewDate);
            }

            let endDate = new Date(startDate);
            if (mode === 'current') {
                endDate = startDate;
            } else {
                let limit = parseInt(range);
                // Hard limit 365 days
                if (limit > 365) limit = 365;
                endDate.setDate(endDate.getDate() + limit - 1);
                
                // Cap at retirement date if closer
                if (retirementDate) {
                    const rDate = new Date(retirementDate);
                    if (rDate < endDate && rDate >= startDate) {
                        endDate = rDate;
                    }
                }
            }

            if (mode === 'grid') {
                generateGridPrint(startDate, endDate);
            } else if (mode === 'list') {
                generateListPrint(startDate, endDate);
            } else {
                // For current view, we don't need to generate, just print the body but hide wrappers.
                // However, our CSS logic hides .calendar-container and shows #print-area.
                // So we should clone the current card to #print-area.
                const clone = els.content.cloneNode(true);
                // Ensure styles (width) fit paper
                clone.style.maxWidth = '100%';
                clone.style.border = '1px solid #ccc';
                els.printArea.className = 'block p-4';
                els.printArea.appendChild(clone);
            }

            togglePrintModal();
            setTimeout(() => {
                window.print();
                // Clear after print
                // els.printArea.innerHTML = ''; // Keep for debugging or clearing later?
            }, 500);
        }

        function generateGridPrint(start, end) {
            els.printArea.className = 'print-grid';
            let curr = new Date(start);
            const rDateObj = retirementDate ? new Date(retirementDate) : null;
            if(rDateObj) rDateObj.setHours(0,0,0,0);

            while (curr <= end) {
                // Logic to build a card string
                const y = curr.getFullYear() - 1911;
                const m = curr.getMonth() + 1;
                const d = curr.getDate();
                const dow = curr.getDay();
                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                const weekChar = weekdays[dow];
                
                let colorClass = "text-retro-ink";
                if (dow === 0) colorClass = "text-retro-red";
                if (dow === 6) colorClass = "text-retro-green";

                // Countdown
                let countdownText = "";
                if (rDateObj) {
                    const diff = Math.ceil((rDateObj - curr) / (1000 * 60 * 60 * 24));
                    countdownText = diff > 0 ? `剩餘 ${diff} 天` : "已退休";
                }

                const motto = getMottoForDate(curr);

                const cardHtml = `
                    <div class="print-card">
                        <div class="text-center border-b pb-1 w-full text-xs text-gray-500">
                            民國${y}年 ${m}月${d}日
                        </div>
                        <div class="flex-1 flex flex-col items-center justify-center">
                            <div class="text-6xl font-black ${colorClass}">${d}</div>
                            <div class="text-xl font-bold ${colorClass} border-2 border-current rounded-full w-8 h-8 flex items-center justify-center mt-1">${weekChar}</div>
                        </div>
                        <div class="text-center w-full mt-2">
                             <div class="text-sm font-bold text-gray-700 mb-1">${motto}</div>
                             <div class="text-xs bg-gray-100 rounded py-1 font-bold text-retro-green">${countdownText}</div>
                        </div>
                    </div>
                `;
                els.printArea.insertAdjacentHTML('beforeend', cardHtml);
                
                curr.setDate(curr.getDate() + 1);
            }
        }

        function generateListPrint(start, end) {
            els.printArea.className = 'block p-4';
            let html = `
                <h2 class="text-xl font-bold mb-4 text-center">退休倒數清單 (${start.toLocaleDateString()} - ${end.toLocaleDateString()})</h2>
                <table class="print-list">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>星期</th>
                            <th>倒數天數</th>
                            <th>備註/每日一句</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            let curr = new Date(start);
            const rDateObj = retirementDate ? new Date(retirementDate) : null;
            if(rDateObj) rDateObj.setHours(0,0,0,0);

            while (curr <= end) {
                const dateStr = `${curr.getFullYear()-1911}/${curr.getMonth()+1}/${curr.getDate()}`;
                const dow = curr.getDay();
                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                
                let rowStyle = "";
                if (dow === 0 || dow === 6) rowStyle = "background-color: #fafafa;";

                let countdownText = "-";
                if (rDateObj) {
                    const diff = Math.ceil((rDateObj - curr) / (1000 * 60 * 60 * 24));
                    countdownText = diff;
                }
                const motto = getMottoForDate(curr);

                html += `
                    <tr style="${rowStyle}">
                        <td>${dateStr}</td>
                        <td>${weekdays[dow]}</td>
                        <td style="font-weight:bold; color:#009e46;">${countdownText}</td>
                        <td style="color:#666;">${motto}</td>
                    </tr>
                `;
                curr.setDate(curr.getDate() + 1);
            }
            html += `</tbody></table>`;
            els.printArea.innerHTML = html;
        }

        // Init
        init();

    </script>
</body>
</html>
